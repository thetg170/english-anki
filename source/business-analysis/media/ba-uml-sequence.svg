<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-label="UML sequence: thứ tự gọi API">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334155"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="450.0" y="30" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#172033">UML sequence: thứ tự gọi API</text>
<rect x="30" y="75" width="180" height="48" rx="4" fill="#eff6ff" stroke="#334155" stroke-width="2"/>
<text x="120.0" y="104.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#172033">Ứng dụng</text>
<line x1="120" y1="123" x2="120" y2="405" stroke="#334155" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="350" y="75" width="180" height="48" rx="4" fill="#eff6ff" stroke="#334155" stroke-width="2"/>
<text x="440.0" y="104.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#172033">Customer API</text>
<line x1="440" y1="123" x2="440" y2="405" stroke="#334155" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="650" y="75" width="180" height="48" rx="4" fill="#eff6ff" stroke="#334155" stroke-width="2"/>
<text x="740.0" y="104.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#172033">Order API</text>
<line x1="740" y1="123" x2="740" y2="405" stroke="#334155" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="120" y1="175" x2="440" y2="175" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="280" y="164" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#172033">1. Tạo khách hàng</text>
<line x1="440" y1="220" x2="120" y2="220" stroke="#334155" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="280" y="211" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#172033">2. Trả customerId</text>
<line x1="120" y1="285" x2="740" y2="285" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="430" y="275" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#172033">3. Tạo đơn với customerId</text>
<line x1="740" y1="335" x2="120" y2="335" stroke="#334155" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="430" y="326" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#172033">4. Trả mã đơn hoặc lỗi</text>
<text x="450" y="440" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#475569">Đọc từ trên xuống: không tạo đơn trước khi có customerId.</text>
</svg>
