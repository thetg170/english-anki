<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-label="UML state: trạng thái và điều kiện chuyển">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334155"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="450.0" y="30" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#172033">UML state: trạng thái và điều kiện chuyển</text>
<circle cx="70" cy="190" r="9" fill="#172033" stroke="#334155" stroke-width="2"/>
<rect x="155" y="160" width="125" height="60" rx="18" fill="#eff6ff" stroke="#334155" stroke-width="2"/>
<text x="217.5" y="195.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#172033">Draft</text>
<rect x="355" y="160" width="125" height="60" rx="18" fill="#eff6ff" stroke="#334155" stroke-width="2"/>
<text x="417.5" y="195.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#172033">Paid</text>
<rect x="555" y="160" width="125" height="60" rx="18" fill="#eff6ff" stroke="#334155" stroke-width="2"/>
<text x="617.5" y="195.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#172033">Shipped</text>
<rect x="755" y="160" width="125" height="60" rx="18" fill="#eff6ff" stroke="#334155" stroke-width="2"/>
<text x="817.5" y="195.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#172033">Refunded</text>
<line x1="79" y1="190" x2="155" y2="190" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="280" y1="190" x2="355" y2="190" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="317.5" y="170" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#172033">thanh toán</text>
<line x1="480" y1="190" x2="555" y2="190" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="517.5" y="170" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#172033">giao hàng</text>
<line x1="680" y1="190" x2="755" y2="190" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="717.5" y="170" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#172033">hoàn tiền</text>
<text x="220" y="295" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#172033">Draft: có thể sửa</text>
<text x="420" y="295" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#172033">Paid: không sửa</text>
<text x="450" y="365" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#475569">Mỗi mũi tên cần điều kiện và người có quyền thực hiện.</text>
